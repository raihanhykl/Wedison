name: CI/CD - Wedison Produksi (main -> VPS wedison.co)

# Build standalone di GitHub Actions (hindari OOM di VPS), rsync ke rilis baru
# /home/wedison/wedison-prod/releases/<sha>, lalu bin/deploy-release.sh di VPS:
# build backend, backup DB, migrasi, pindah symlink `current`, reload bergantian
# (tanpa downtime), health check -> gagal = otomatis kembali ke rilis sebelumnya.
# Rollback manual: ssh wedison@VPS 'wedison-prod/bin/rollback.sh'. Runbook: docs/DEPLOY-PRODUCTION.md
# Situs statis lama sekarang di branch `legacy-static` (workflow legacy-static.yml).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false # jangan potong deploy produksi di tengah jalan

env:
  NODE_VERSION: "22"
  VPS_HOST: "76.13.22.124"
  VPS_USER: "wedison"
  PROD_ROOT: "/home/wedison/wedison-prod"
  SITE_URL: "https://wedison.co"
  # Port backend Express produksi (harus sama dengan PORT di shared/server.env)
  API_PORT: "4003"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.SITE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build (standalone)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
          # NEXT_PUBLIC_* di-inline ke bundle saat build
          NEXT_PUBLIC_EMAIL_CONFIG_serviceId: ${{ secrets.EMAIL_SERVICE_ID }}
          NEXT_PUBLIC_EMAIL_CONFIG_templateId: ${{ secrets.EMAIL_TEMPLATE_ID }}
          NEXT_PUBLIC_EMAIL_CONFIG_publicKey: ${{ secrets.EMAIL_PUBLIC_KEY }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
          # ID container GTM produksi (publik, bukan secret)
          NEXT_PUBLIC_GTM_ID: GTM-TGNBLQ37
          # Meta (Facebook) Pixel — produksi saja (publik, bukan secret)
          NEXT_PUBLIC_META_PIXEL_ID: "1869176430902673"
          # Rewrite /api/* di next.config dibaca saat BUILD -> port backend produksi
          API_INTERNAL_URL: http://127.0.0.1:${{ env.API_PORT }}

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Upload rilis
        run: |
          DEST=${{ env.VPS_USER }}@${{ env.VPS_HOST }}
          REL=${{ env.PROD_ROOT }}/releases/${{ github.sha }}
          ssh $DEST "mkdir -p $REL/web $REL/server"
          # --link-dest + --checksum: file yang isinya sama dengan rilis aktif di-hardlink (mtime
          # hasil build selalu baru, jadi bandingkan isi) -> hanya file berubah yang dikirim.
          rsync -az --checksum --delete --link-dest=${{ env.PROD_ROOT }}/current/web/ \
            .next/standalone/ $DEST:$REL/web/
          rsync -az --delete \
            --exclude node_modules --exclude dist --exclude src/generated \
            --exclude .env --exclude uploads --exclude .seeded \
            server/ $DEST:$REL/server/
          rsync -az ecosystem.prod.config.js $DEST:${{ env.PROD_ROOT }}/ecosystem.prod.config.js
          rsync -az --delete deploy/prod/bin/ $DEST:${{ env.PROD_ROOT }}/bin/

      - name: Aktifkan rilis (migrasi + reload tanpa downtime)
        run: |
          ssh ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "bash ${{ env.PROD_ROOT }}/bin/deploy-release.sh ${{ github.sha }}"
