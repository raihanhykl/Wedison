# nginx vhost untuk wedison-landing (SSR) di VPS.
# Mengikuti gaya vhost yang sudah ada (n8n.wedison.tech) + tambahan khusus Next.
# Pasang:  sudo cp deploy/nginx/ssr.wedison.tech.conf /etc/nginx/sites-available/ssr.wedison.tech
#          sudo ln -s /etc/nginx/sites-available/ssr.wedison.tech /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d ssr.wedison.tech   # certbot menambah blok 443 + redirect 80->443
server {
    server_name ssr.wedison.tech;

    # Aset Next yang immutable -> cache panjang di browser.
    # add_header di sini MEMBATALKAN pewarisan add_header level server -> include ulang snippet.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/wedison-security-headers.conf;
    }

    # Backend admin/CMS (Express, server/) -> langsung ke API port 4002, tanpa lewat Next.
    # /api/revalidate TIDAK di sini (itu route handler Next) -> jatuh ke location / di bawah.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # File upload Media Library (nama file unik; Express sudah kirim Cache-Control immutable).
    # Sengaja tanpa add_header di sini agar header keamanan level server tetap diwarisi.
    location /api/uploads/ {
        proxy_pass http://127.0.0.1:4002;
        proxy_set_header Host $host;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    client_max_body_size 10M;   # = MAX_UPLOAD_MB di server/.env

    # HSTS (snippet bersama; header keamanan lain dikirim aplikasi Next/Express).
    # Staging noindex (meta robots, X-Robots-Tag, robots.txt) diatur oleh build Next lewat
    # NEXT_PUBLIC_SITE_URL/NEXT_PUBLIC_ROBOTS_NOINDEX di deploy-ssr.yml, bukan di nginx.
    include snippets/wedison-security-headers.conf;

    # certbot akan menambahkan listen 443 ssl + redirect 80->443 di sini.
    listen 80;
    listen [::]:80;
}
