# nginx wedison.co -> salinan statis SITUS LAMA (mode "legacy", rollback darurat tanpa DNS).
# Isi /var/www/wedison-legacy = mirror public_html Hostinger (workflow legacy-static.yml).
# Meniru .htaccess lama: non-www + HTTPS, index.html per folder, 404.html.
# Aktifkan: sudo wedison-site legacy   |   kembali: sudo wedison-site app
# Catatan: admin/CMS & form booking versi baru TIDAK tersedia di mode ini (situs lama memang
# tidak punya backend); form kontak situs lama tetap jalan (EmailJS di browser).

server {
    listen 80;
    listen [::]:80;
    server_name wedison.co www.wedison.co;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://wedison.co$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.wedison.co;

    ssl_certificate /etc/letsencrypt/live/wedison.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wedison.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://wedison.co$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wedison.co;

    ssl_certificate /etc/letsencrypt/live/wedison.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wedison.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/wedison-legacy;
    index index.html;
    absolute_redirect off; # /athena -> /athena/ tetap relatif (host & https dipertahankan)
    error_page 404 /404.html;

    # Jangan sajikan file sistem/hosting (.htaccess, .php, sisa zip macOS).
    location ~ (^|/)\. { return 404; }
    location ~ \.php$ { return 404; }
    location ^~ /__MACOSX/ { return 404; }

    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
