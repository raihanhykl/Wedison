# nginx PRODUKSI wedison.co -> Next.js SSR (mode "app").
# Pasangan: wedison.co.legacy.conf (salinan situs lama). Hanya SATU yang aktif:
#   /etc/nginx/sites-enabled/wedison.co -> sites-available/wedison.co.{app,legacy}
#   ganti mode: sudo wedison-site app|legacy   (lihat docs/DEPLOY-PRODUCTION.md)

# Web utama :3003; cadangan :3013 dipakai HANYA saat utama tidak menjawab (mis. saat reload
# deploy) -> deploy tanpa downtime, tapi traffic normal tetap ke satu proses.
upstream wedison_prod_web {
    server 127.0.0.1:3003 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:3013 backup;
    keepalive 16;
}

upstream wedison_prod_api {
    server 127.0.0.1:4003;
    keepalive 8;
}

# HTTP: challenge ACME (renew sertifikat) + redirect ke https://wedison.co
server {
    listen 80;
    listen [::]:80;
    server_name wedison.co www.wedison.co;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://wedison.co$request_uri;
    }
}

# www -> apex (canonical https://wedison.co)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.wedison.co;

    ssl_certificate /etc/letsencrypt/live/wedison.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wedison.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://wedison.co$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wedison.co;

    ssl_certificate /etc/letsencrypt/live/wedison.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wedison.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M; # = MAX_UPLOAD_MB di shared/server.env

    # Header umum proxy -> Next/Express (keepalive upstream butuh HTTP/1.1 + Connection kosong).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Aset Next yang immutable -> cache panjang di browser. Chunk build lama (HTML situs lama
    # yang masih ter-cache di browser) tidak ada di app -> diambil dari salinan situs lama.
    location ^~ /_next/static/ {
        proxy_pass http://wedison_prod_web;
        proxy_intercept_errors on;
        error_page 404 = @legacy;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Backend admin/CMS (Express) langsung, tanpa lewat Next.
    # /api/revalidate TIDAK di sini (route handler Next) -> jatuh ke location / di bawah.
    location ^~ /api/v1/ {
        proxy_pass http://wedison_prod_api;
        proxy_read_timeout 60s;
    }

    # File upload Media Library (Express sudah kirim Cache-Control immutable).
    location ^~ /api/uploads/ {
        proxy_pass http://wedison_prod_api;
        expires 30d;
    }

    # Sitemap lama (next-sitemap) -> sitemap app; jangan sajikan daftar URL lama dari salinan.
    location = /sitemap-0.xml {
        return 301 /sitemap.xml;
    }

    # File ber-ekstensi (pdf, html verifikasi Google, gambar lama, dst.): app dulu; bila app
    # 404, coba salinan situs lama agar link/bookmark lama ke file statis tidak putus.
    location ~ "\.[A-Za-z0-9]{2,5}$" {
        proxy_pass http://wedison_prod_web;
        proxy_intercept_errors on;
        error_page 404 = @legacy;
    }

    location / {
        proxy_pass http://wedison_prod_web;
    }

    # Salinan statis situs lama (/var/www/wedison-legacy, disinkron workflow legacy-static).
    # Tidak ada juga di sana -> kembalikan halaman 404 app.
    location @legacy {
        root /var/www/wedison-legacy;
        if ($uri ~* "(^|/)\.|\.php$|^/__MACOSX/") { return 404; }
        try_files $uri @app404;
    }
    location @app404 {
        proxy_pass http://wedison_prod_web;
    }

    # Tanpa includeSubDomains: subdomain wedison.co lain dikelola tim DNS terpisah dan
    # belum tentu semuanya HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
