# Header keamanan level nginx untuk SEMUA respons vhost Wedison.
# Pasang: sudo cp deploy/nginx/snippets/wedison-security-headers.conf /etc/nginx/snippets/
#
# PENTING (perilaku nginx): `add_header` TIDAK diwariskan ke blok `location` yang memiliki
# `add_header` sendiri (mis. Cache-Control di /_next/static/). Karena itu snippet ini
# di-`include` di level server DAN di setiap location yang punya add_header, agar HSTS tetap
# terkirim untuk aset statis (audit Screaming Frog 2026-09: HSTS/nosniff hilang di 26% URL).
#
# Header lain (CSP, X-Frame-Options, Referrer-Policy, Permissions-Policy, X-Robots-Tag staging)
# dikirim oleh aplikasi Next (next.config.ts -> headers()) dan Express (helmet), jadi tidak
# diduplikasi di sini. HSTS hanya di nginx (terminasi TLS).
#
# Tanpa includeSubDomains: subdomain wedison.co lain dikelola tim DNS terpisah dan belum tentu
# semuanya HTTPS. Tambahkan "; includeSubDomains; preload" hanya setelah semua subdomain HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
